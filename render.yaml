services:
  - type: web
    name: pps-bus-maps
    env: node
    rootDir: .
    buildCommand: npm run build:all
    startCommand: npm run start:production
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    # Uncomment and set if you have a Google Drive API key
    # envVars:
    #   - key: GOOGLE_API_KEY
    #     sync: false  # Set this in Render dashboard




