    content="Interactive bus route maps for Portland Public Schools. Find your school, view routes, and locate bus stops." />
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <!-- Theme color - set to transparent for Safari mobile address bar -->
  <meta name="theme-color" id="theme-color-meta" content="transparent" />
  <script>
    (function () {
      var savedDarkMode = localStorage.getItem('darkMode');
      var isDark = savedDarkMode === 'true' ||
        (savedDarkMode === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      
      // Set dark-mode class on HTML element immediately
      if (isDark) {
        document.documentElement.classList.add('dark-mode');
      }
      
      // Keep theme-color transparent for Safari mobile address bar
      var themeColorMeta = document.getElementById('theme-color-meta');
      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', 'transparent');
      }
    })();
  </script>

  <!-- Open Graph / Facebook -->

  <!-- Google Analytics 4 - Load gtag.js BEFORE React for proper referrer tracking -->
  <script>
    // Capture referrer immediately before any SPA navigation can clear it
    window.__INITIAL_REFERRER__ = document.referrer || '';
    window.__INITIAL_URL__ = window.location.href;
    window.__LANDING_TIME__ = Date.now();
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZYZHYNSPZG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    
    // Configure GA4 with enhanced settings
    gtag('config', 'G-ZYZHYNSPZG', {
      // Send page view on initial load (React will handle subsequent ones)
      send_page_view: true,
      // Enable debug mode in development (check console for gtag events)
      debug_mode: window.location.hostname === 'localhost',
      // Capture the referrer properly
      page_referrer: document.referrer,
      // Custom dimensions for better user identification
      custom_map: {
        'dimension1': 'traffic_type',
        'dimension2': 'user_persona', 
        'dimension3': 'referral_source'
      }
    });

    // Track initial referrer as an event (backup for reports)
    if (document.referrer && !document.referrer.includes('ppsbus.com')) {
      gtag('event', 'referral_landing', {
        'referrer_url': document.referrer,
        'referrer_domain': new URL(document.referrer).hostname,
        'landing_page': window.location.pathname
      });
    }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "PPS Bus Map",

        "Portland Public Schools Bus Map"
      ],

    }
  </script>
