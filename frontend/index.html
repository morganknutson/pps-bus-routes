<!doctype html>
<html lang="en">

<head prefix="og: https://ogp.me/ns#">
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PPS Bus Map" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description"
    content="Interactive bus route maps for Portland Public Schools. Find your school, view routes, and locate bus stops." />
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <!-- Theme color - set synchronously before React loads -->
  <meta name="theme-color" content="#ffffff" />
  <script>
    (function () {
      var savedDarkMode = localStorage.getItem('darkMode');
      var isDark = savedDarkMode === 'true' ||
        (savedDarkMode === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#3A3A3A');
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ppsbus.com/" />
  <meta property="og:title" content="Portland Public Schools (PPS) Bus Route Map" />
  <meta property="og:site_name" content="PPS Bus Map" />
  <meta property="og:description"
    content="Interactive bus route maps for Portland Public Schools. Find your school, view routes, and locate bus stops." />
  <meta property="og:image" content="https://ppsbus.com/og-image.png" />
  <meta property="og:image:secure_url" content="https://ppsbus.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Portland Public Schools Bus Map Preview" />
  <link rel="image_src" href="https://ppsbus.com/og-image.png" />
  <meta itemprop="image" content="https://ppsbus.com/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://ppsbus.com/" />
  <meta name="twitter:title" content="Portland Public Schools (PPS) Bus Route Map" />
  <meta name="twitter:description" content="Interactive bus route maps for Portland Public Schools." />
  <meta name="twitter:image" content="https://ppsbus.com/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Portland Public Schools (PPS) Bus Route Map</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PPS Bus Map",
      "alternateName": [
        "Portland Public Schools Bus Map"
      ],
      "url": "https://ppsbus.com/"
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
